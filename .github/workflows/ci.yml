name: CI -- Test & Check

on:
  pull_request:

concurrency:
  # For pull_request events only, cancel previous runs for the same pull request
  group: build-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.number || github.job_id }}
  cancel-in-progress: true

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: node-version/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: node-version

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        working-directory: node-version

      - name: Check formatting
        run: task check-format
        working-directory: node-version

      - name: Check linting
        run: task check-lint
        working-directory: node-version

      - name: Check types
        run: task check-types
        working-directory: node-version

      - name: Run tests
        run: task test
        working-directory: node-version

  result:
    name: Result
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [node-check]
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
