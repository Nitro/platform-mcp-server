name: Claude PR Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

jobs:
    claude-review:
        name: Claude Code Review
        runs-on: ubuntu-latest
        if: github.event.pull_request.head.repo.fork == false
        concurrency:
            group: claude-review-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        permissions:
            contents: read
            pull-requests: write
            issues: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Run Claude Code Review
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  allowed_bots: 'claude'
                  track_progress: true
                  claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*)"'
                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ github.event.pull_request.number }}

                      Perform a code review for this PR. Start by reading CLAUDE.md and style-guide.md for project context — do not flag patterns listed there as intentional choices.

                      Be pragmatic: strike a good balance between code quality and utility. Follow the YAGNI principle — simple is better than complex. Do not flag things that don't matter in practice.

                      Focus on:
                      - Bugs, security vulnerabilities
                      - Race conditions, memory leaks, misplaced business logic
                      - Significant structural issues

                      Use inline comments for specific line-level issues. Use a top-level comment only for a brief overall summary or if there are no issues.
