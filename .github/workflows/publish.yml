name: Publish Release

# Publishes a release whenever a version bump lands on main (normally via a
# release PR opened by the "Open Release PR" workflow, release-pr.yml).
# Builds the .mcpb from the merged commit, tags it, and creates the GitHub
# release. workflow_dispatch is a manual fallback that publishes the version
# currently in manifest.json (no-op if that version is already tagged).

on:
  push:
    branches: [main]
    paths: [node-version/manifest.json]
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          echo "value=$(jq -r '.version' node-version/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if version is already released
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check for the release, not the tag: if a previous run created the
          # tag but failed before publishing the release, a rerun must still
          # proceed (gh release create accepts a pre-existing tag).
          VERSION="${{ steps.version.outputs.value }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; nothing to publish."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: node-version/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb

      - name: Install dependencies
        run: npm ci
        working-directory: node-version

      - name: Build
        run: task build
        working-directory: node-version

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          gh release create "v${VERSION}" build/*.mcpb \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
