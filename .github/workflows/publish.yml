name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (x.y.z). If omitted, increments minor and resets patch."
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            if ! echo "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version format: '$INPUT'. Must be x.y.z"
              exit 1
            fi
            echo "value=$INPUT" >> "$GITHUB_OUTPUT"
          else
            CURRENT=$(jq -r '.version' node-version/manifest.json)
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            echo "value=${MAJOR}.${NEW_MINOR}.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          jq --arg v "$VERSION" '.version = $v' node-version/manifest.json > node-version/manifest.json.tmp
          mv node-version/manifest.json.tmp node-version/manifest.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: node-version/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb

      - name: Install dependencies
        run: npm ci
        working-directory: node-version

      - name: Build
        run: task build
        working-directory: node-version

      - name: Commit version bump
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config --local user.email "robotics@gonitro.com"
          git config --local user.name "nitro-robot"
          git add node-version/manifest.json
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"

      - name: Push version change
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.NITRO_ROBOT_COMMIT_TOKEN }}
          tags: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          gh release create "v${VERSION}" build/*.mcpb \
            --title "v${VERSION}" \
            --generate-notes
