name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (x.y.z). If omitted, increments minor and resets patch."
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            if ! echo "$INPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version format: '$INPUT'. Must be x.y.z"
              exit 1
            fi
            echo "value=$INPUT" >> "$GITHUB_OUTPUT"
          else
            CURRENT=$(jq -r '.version' manifest.json)
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            echo "value=${MAJOR}.${NEW_MINOR}.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Update pyproject.toml
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Commit and push to main
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json pyproject.toml
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build
        run: task build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          MCPB_FILE=$(ls build/*.mcpb)
          gh release create "v${VERSION}" "$MCPB_FILE" \
            --title "v${VERSION}" \
            --generate-notes
