version: '3'

includes:
  node:
    dir: ./node-version
    taskfile: ./node-version
    aliases: [n]

tasks:
  release:
    desc: "Open a release PR (optional version: task release -- 1.2.3); merging it publishes the release"
    cmds:
      - 'gh workflow run release-pr.yml --repo Nitro/platform-mcp-server {{if .CLI_ARGS}}-f version={{.CLI_ARGS}}{{end}}'

  clean-corpus:
    cmds:
      - rm -rf ./corpus/*converted*
      - rm -rf ./corpus/*merged*

  tail-logs: tail -f ~/Library/Logs/Claude/main.log
