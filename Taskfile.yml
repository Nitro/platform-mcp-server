version: '3'

includes:
  node:
    dir: ./node-version
    taskfile: ./node-version
    aliases: [n]

tasks:
  publish:
    desc: "Trigger the publish release workflow (optional version: task publish -- 1.2.3)"
    cmds:
      - 'gh workflow run publish.yml --repo Nitro/platform-mcp-server {{if .CLI_ARGS}}-f version={{.CLI_ARGS}}{{end}}'

  clean-corpus:
    cmds:
      - rm -rf ./corpus/*converted*
      - rm -rf ./corpus/*merged*

  tail-logs: tail -f ~/Library/Logs/Claude/main.log
