version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - npm install

  check-format:
    desc: Check formatting with Prettier
    cmds:
      - npm run check:format

  check-types:
    desc: Run TypeScript type checking
    cmds:
      - npm run check:types

  check-lint:
    desc: Run ESLint
    cmds:
      - npm run check:lint

  check:
    desc: Run all code quality checks
    cmds:
      - task: check-format
      - task: check-types
      - task: check-lint

  autoformat:
    desc: Auto-format source files with Prettier
    cmds:
      - npm run format

  test:
    desc: Run tests with coverage
    cmds:
      - npm test

  run:
    desc: Run the MCP server
    cmds:
      - npm run dev

  bundle:
    desc: Bundle TypeScript source into dist/bundle.cjs
    cmds:
      - npm run bundle

  build:
    desc: Build mcpb package
    vars:
      VERSION:
        sh: node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)"
    cmds:
      - task: bundle
      # Stages dist/, package.json, icon.png, the repo LICENSE, and a manifest.json
      # with a tools array freshly generated from the live server (see prepareBundle.ts)
      # into ../build/stage, so the packed bundle never depends on manual upkeep of
      # either the tools list or a LICENSE file living under node-version/.
      - npm run prepare-bundle
      - npx @anthropic-ai/mcpb pack ../build/stage ../build/nitro-pdf-services-node-{{.VERSION}}.mcpb

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf node_modules dist coverage
