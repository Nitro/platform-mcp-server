<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitro PDF Viewer</title>
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" />
    <style>
      :root {
        --nitro-orange:   #F54811;
        --nitro-orange-h: #D93D0E;
        --nitro-navy:     #090B21;
        --nitro-navy-l:   #111327;
        --nitro-border:   #1E2240;
        --nitro-text:     #E8ECF4;
        --nitro-muted:    #7A80A0;
        --nitro-white:    #FFFFFF;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: white;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Top toolbar (editing) ── */
      #toolbar {
        height: 52px;
        background: var(--nitro-navy);
        border-bottom: 1px solid var(--nitro-border);
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 4px;
        flex-shrink: 0;
        user-select: none;
        z-index: 10;
      }
      #logo { display: flex; align-items: center; margin-right: 12px; flex-shrink: 0; }
      .sep { width: 1px; height: 24px; background: var(--nitro-border); margin: 0 6px; flex-shrink: 0; }

      .tb-btn {
        display: flex; align-items: center; gap: 5px;
        padding: 6px 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--nitro-text);
        font: 500 13px/1 inherit;
        font-family: inherit;
        cursor: pointer; white-space: nowrap;
        transition: background .12s, border-color .12s;
        flex-shrink: 0;
      }
      .tb-btn:hover { background: rgba(255,255,255,.07); border-color: var(--nitro-border); }
      .tb-btn.active { background: rgba(245,72,17,.15); border-color: var(--nitro-orange); color: var(--nitro-orange); }
      .tb-icon { padding: 6px 9px; font-size: 16px; }

      #btn-save {
        margin-left: auto;
        background: var(--nitro-orange); border-color: var(--nitro-orange);
        color: #fff; font-weight: 600; padding: 7px 20px;
      }
      #btn-save:hover { background: var(--nitro-orange-h); border-color: var(--nitro-orange-h); }
      #btn-save.saving { opacity: .6; pointer-events: none; }

      #font-size-input {
        width: 46px; padding: 5px 6px;
        background: rgba(255,255,255,.06);
        border: 1px solid var(--nitro-border);
        border-radius: 6px; color: var(--nitro-text);
        font: 600 12px/1 inherit; text-align: center; flex-shrink: 0;
      }
      #font-size-input:focus { outline: none; border-color: var(--nitro-orange); }
      .font-label { font-size: 11px; color: var(--nitro-muted); flex-shrink: 0; }

      #status {
        font-size: 12px; color: var(--nitro-muted); padding: 0 6px;
        opacity: 0; transition: opacity .25s; flex-shrink: 0;
        max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #status.visible { opacity: 1; }
      #status.err { color: #f87171; }

      /* ── Pages scroll area ── */
      #pages {
        flex: 1;
        min-height: 0;
        overflow: auto;                 /* both axes — horizontal scroll when zoomed in */
        display: flex;
        flex-direction: column;
        align-items: center;            /* center pages horizontally */
        justify-content: safe center;   /* center vertically when shorter than panel; stays scrollable when taller */
        gap: 16px;
        padding: 16px;
        background: #525659;
      }
      .page-wrapper {
        position: relative;
        background: white;
        box-shadow: 0 1px 5px rgba(0,0,0,.4);
        line-height: 0;
        flex-shrink: 0;
      }
      .page-wrapper canvas { display: block; height: auto; }

      .overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
      .tbx-wrap { position: absolute; pointer-events: all; }
      .tbx-wrap:hover .tbx-del { opacity: 1; }
      .tbx {
        display: block; width: 100%; height: 100%;
        background: rgba(255,255,220,.85);
        border: 1.5px solid var(--nitro-orange); border-radius: 3px;
        padding: 3px 6px; font-family: Helvetica, Arial, sans-serif;
        line-height: 1.35; color: #111; resize: both; outline: none; overflow: hidden;
      }
      .tbx:focus { box-shadow: 0 0 0 2px rgba(245,72,17,.2); }
      .tbx-del {
        position: absolute; top: -9px; right: -9px;
        width: 18px; height: 18px; border-radius: 50%;
        background: #e53e3e; color: #fff; border: none; cursor: pointer;
        font-size: 11px; line-height: 18px; text-align: center;
        opacity: 0; transition: opacity .15s; z-index: 20; pointer-events: all;
      }

      #loader { color: #ccc; font-size: 14px; padding: 40px; }

      /* ── Bottom bar (navigation + zoom) ── */
      #bottombar {
        height: 44px;
        background: var(--nitro-navy);
        border-top: 1px solid var(--nitro-border);
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 10px;
        flex-shrink: 0;
        user-select: none;
        z-index: 10;
      }
      .bb-group { display: flex; align-items: center; gap: 6px; }
      .bb-spacer { flex: 1; }

      .bb-btn {
        display: flex; align-items: center; justify-content: center;
        width: 28px; height: 28px;
        border: none; border-radius: 6px;
        background: transparent; color: var(--nitro-text);
        cursor: pointer; font-size: 15px;
        transition: background .12s;
      }
      .bb-btn:hover { background: rgba(255,255,255,.1); }
      .bb-btn:disabled { opacity: .3; cursor: not-allowed; }

      #page-input {
        width: 38px; height: 26px;
        background: rgba(255,255,255,.08);
        border: 1px solid var(--nitro-border); border-radius: 5px;
        color: var(--nitro-text); font: 500 13px/1 inherit; text-align: center;
      }
      #page-input:focus { outline: none; border-color: var(--nitro-orange); }
      .bb-label { font-size: 12px; color: var(--nitro-muted); }

      #zoom-slider {
        width: 120px; height: 4px; -webkit-appearance: none; appearance: none;
        background: var(--nitro-border); border-radius: 3px; cursor: pointer;
      }
      #zoom-slider::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--nitro-orange); cursor: pointer;
      }
      #zoom-slider::-moz-range-thumb {
        width: 14px; height: 14px; border: none; border-radius: 50%;
        background: var(--nitro-orange); cursor: pointer;
      }
      #zoom-pct { font-size: 12px; color: var(--nitro-text); font-weight: 600; min-width: 40px; text-align: center; }

      #fit-select {
        height: 28px; padding: 0 8px;
        background: rgba(255,255,255,.08);
        border: 1px solid var(--nitro-border); border-radius: 6px;
        color: var(--nitro-text); font: 500 12px/1 inherit; cursor: pointer;
      }
      #fit-select:focus { outline: none; border-color: var(--nitro-orange); }
    </style>
  </head>

  <body>
    <!-- ── Top toolbar: editing ── -->
    <div id="toolbar">
      <div id="logo">

      </div>
      <div class="sep"></div>
      <button class="tb-btn tb-icon" id="btn-rot-l" title="Rotate left">↺</button>
      <button class="tb-btn tb-icon" id="btn-rot-r" title="Rotate right">↻</button>
      <div class="sep"></div>
      <button class="tb-btn" id="btn-add-text" title="Click on the page to place a text box">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M4 9.5h6M7 4.5v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Add Text
      </button>
      <input id="font-size-input" type="number" value="14" min="6" max="96" title="Font size (px)" />
      <span class="font-label">px</span>
      <span id="status"></span>
      <button id="btn-save" class="tb-btn">Save</button>
    </div>

    <!-- ── Pages ── -->
    <div id="pages"><p id="loader">Loading PDF…</p></div>

    <!-- ── Bottom bar: navigation + zoom ── -->
    <div id="bottombar">
      <div class="bb-group">
        <button class="bb-btn" id="btn-first" title="First page">⏮</button>
        <button class="bb-btn" id="btn-prev" title="Previous page">◀</button>
        <input id="page-input" type="number" min="1" value="1" />
        <span class="bb-label">of <span id="page-total">1</span></span>
        <button class="bb-btn" id="btn-next" title="Next page">▶</button>
        <button class="bb-btn" id="btn-last" title="Last page">⏭</button>
      </div>

      <div class="bb-spacer"></div>

      <div class="bb-group">
        <button class="bb-btn" id="btn-zoom-out" title="Zoom out">−</button>
        <input id="zoom-slider" type="range" min="50" max="300" step="5" value="100" autocomplete="off" />
        <button class="bb-btn" id="btn-zoom-in" title="Zoom in">+</button>
        <span id="zoom-pct">100%</span>
        <select id="fit-select" title="Fit">
          <option value="width">Fit Width</option>
          <option value="page">Fit Page</option>
          <option value="50">50%</option>
          <option value="75">75%</option>
          <option value="100">100%</option>
          <option value="125">125%</option>
          <option value="150">150%</option>
          <option value="200">200%</option>
          <option value="300">300%</option>
        </select>
      </div>
    </div>

    <script type="module">
      import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

      // ── State ──
      const state = {
        filePath: null, pdfDoc: null, pageCount: 0,
        zoom: 1.0,          // multiplier on top of fit-to-width (1.0 = fit width)
        rotations: [], addMode: false, textBoxes: [],
        currentPage: 1,
        ready: false,       // true once load() finishes — guards stray input events
      };

      const ZOOM_MIN = 0.5, ZOOM_MAX = 3.0, ZOOM_STEP = 0.25;

      // ── DOM ──
      const $pages    = document.getElementById('pages');
      const $status   = document.getElementById('status');
      const $btnSave  = document.getElementById('btn-save');
      const $btnRotL  = document.getElementById('btn-rot-l');
      const $btnRotR  = document.getElementById('btn-rot-r');
      const $btnAdd   = document.getElementById('btn-add-text');
      const $fontSize = document.getElementById('font-size-input');
      const $pageInput= document.getElementById('page-input');
      const $pageTotal= document.getElementById('page-total');
      const $btnFirst = document.getElementById('btn-first');
      const $btnPrev  = document.getElementById('btn-prev');
      const $btnNext  = document.getElementById('btn-next');
      const $btnLast  = document.getElementById('btn-last');
      const $zoomOut  = document.getElementById('btn-zoom-out');
      const $zoomIn   = document.getElementById('btn-zoom-in');
      const $zoomSlider = document.getElementById('zoom-slider');
      const $zoomPct  = document.getElementById('zoom-pct');
      const $fitSelect= document.getElementById('fit-select');

      function showStatus(msg, isErr=false) {
        $status.textContent = msg;
        $status.className = msg ? (isErr ? 'visible err' : 'visible') : '';
        clearTimeout(showStatus._t);
        if (msg) showStatus._t = setTimeout(()=>{ $status.className=''; }, 3500);
      }
      function getFontSize() { return Math.max(6, Math.min(96, parseInt($fontSize.value,10)||14)); }

      // ── Text boxes ──
      function createTextBox(pageIndex, x, y) {
        const overlay = document.getElementById(`ov-${pageIndex}`);
        if (!overlay) return;
        const fs = getFontSize();
        const w = Math.max(120, fs*8), h = Math.max(fs*2.2, 30);
        const wrap = document.createElement('div');
        wrap.className = 'tbx-wrap';
        wrap.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
        const del = document.createElement('button');
        del.className = 'tbx-del'; del.textContent = '×';
        const ta = document.createElement('textarea');
        ta.className = 'tbx'; ta.placeholder = 'Type here…'; ta.style.fontSize = `${fs}px`;
        wrap.append(del, ta); overlay.appendChild(wrap); ta.focus();
        const entry = { pageIndex, x, y, width:w, height:h, text:'', fontSize:fs, scale: state.zoom };
        state.textBoxes.push(entry);
        ta.addEventListener('input', ()=>{ entry.text = ta.value; });
        new ResizeObserver(()=>{ entry.width = wrap.offsetWidth; entry.height = wrap.offsetHeight; }).observe(wrap);
        del.addEventListener('click', e=>{ e.stopPropagation(); wrap.remove(); state.textBoxes.splice(state.textBoxes.indexOf(entry),1); });
      }

      function setAddMode(on) {
        state.addMode = on;
        $btnAdd.classList.toggle('active', on);
        document.querySelectorAll('.overlay').forEach(o=>{ o.style.pointerEvents = on ? 'all':'none'; o.style.cursor = on?'crosshair':''; });
      }
      $btnAdd.addEventListener('click', ()=> setAddMode(!state.addMode));

      // ── Render ──
      async function renderPage(i) {
        const page = await state.pdfDoc.getPage(i+1);
        const rot  = ((page.rotate)+(state.rotations[i]??0))%360;
        const containerW = $pages.clientWidth - 32;   // minus padding
        const baseVp = page.getViewport({ scale:1.0, rotation:rot });
        const fitScale = containerW / baseVp.width;
        const vp = page.getViewport({ scale: fitScale * state.zoom, rotation: rot });

        let wrap = document.getElementById(`pw-${i}`), canvas, overlay;
        if (!wrap) {
          wrap = document.createElement('div'); wrap.className='page-wrapper'; wrap.id=`pw-${i}`;
          canvas = document.createElement('canvas');
          overlay = document.createElement('div'); overlay.className='overlay'; overlay.id=`ov-${i}`;
          overlay.style.pointerEvents = state.addMode?'all':'none';
          overlay.addEventListener('click', e=>{
            if (!state.addMode) return;
            const r = overlay.getBoundingClientRect();
            createTextBox(i, e.clientX-r.left, e.clientY-r.top);
            setAddMode(false);
          });
          wrap.append(canvas, overlay); $pages.appendChild(wrap);
        } else { canvas = wrap.querySelector('canvas'); overlay = document.getElementById(`ov-${i}`); }

        const dpr = window.devicePixelRatio||1;
        const cw = Math.floor(vp.width), ch = Math.floor(vp.height);
        canvas.width = cw*dpr; canvas.height = ch*dpr;
        canvas.style.width = `${cw}px`; canvas.style.height = `${ch}px`;
        overlay.style.width = `${cw}px`; overlay.style.height = `${ch}px`;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr,0,0,dpr,0,0);
        await page.render({ canvasContext:ctx, viewport:vp }).promise;
      }

      async function renderAll() {
        document.getElementById('loader')?.remove();
        for (let i=0;i<state.pageCount;i++) await renderPage(i);
        $pageTotal.textContent = state.pageCount;
        $pageInput.max = state.pageCount;
      }

      // Re-render preserving the visual center point (zoom-from-center)
      async function rerenderKeepCenter() {
        const sw0 = $pages.scrollWidth || 1, sh0 = $pages.scrollHeight || 1;
        const cxRatio = ($pages.scrollLeft + $pages.clientWidth/2) / sw0;
        const cyRatio = ($pages.scrollTop + $pages.clientHeight/2) / sh0;
        for (let i=0;i<state.pageCount;i++) await renderPage(i);
        const sw1 = $pages.scrollWidth, sh1 = $pages.scrollHeight;
        $pages.scrollLeft = cxRatio*sw1 - $pages.clientWidth/2;
        $pages.scrollTop  = cyRatio*sh1 - $pages.clientHeight/2;
      }

      // ── Zoom ──
      function updateZoomUI() {
        const pct = Math.round(state.zoom*100);
        $zoomPct.textContent = `${pct}%`;
        $zoomSlider.value = Math.min(300, Math.max(50, pct));
        $zoomOut.disabled = state.zoom <= ZOOM_MIN + 0.001;
        $zoomIn.disabled  = state.zoom >= ZOOM_MAX - 0.001;
      }
      async function setZoom(z) {
        state.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
        updateZoomUI();
        await rerenderKeepCenter();
      }
      $zoomIn.addEventListener('click', ()=> setZoom(state.zoom + ZOOM_STEP));
      $zoomOut.addEventListener('click', ()=> setZoom(state.zoom - ZOOM_STEP));
      // Only honor slider input while the user is actively dragging it.
      // The native range input otherwise fires phantom 'input' events (form
      // restore, focus) that hijack the zoom — we ignore all of those.
      let _sliderDragging = false;
      $zoomSlider.addEventListener('pointerdown', ()=>{ _sliderDragging = true; });
      window.addEventListener('pointerup', ()=>{ _sliderDragging = false; });
      $zoomSlider.addEventListener('input', ()=>{
        if (!state.ready || !_sliderDragging) return;
        setZoom(parseInt($zoomSlider.value,10)/100);
      });

      $fitSelect.addEventListener('change', async () => {
        const v = $fitSelect.value;
        if (v === 'width') { await setZoom(1.0); }
        else if (v === 'page') {
          // Fit whole first page in the visible height
          const page = await state.pdfDoc.getPage(1);
          const rot = ((page.rotate)+(state.rotations[0]??0))%360;
          const baseVp = page.getViewport({ scale:1.0, rotation:rot });
          const fitScale = ($pages.clientWidth-32) / baseVp.width;
          const pageHAtFit = baseVp.height * fitScale;
          const availH = $pages.clientHeight - 32;
          await setZoom(availH / pageHAtFit);
        } else {
          await setZoom(parseInt(v,10)/100);
        }
      });

      // Ctrl/Cmd + wheel to zoom
      $pages.addEventListener('wheel', e => {
        if (!(e.ctrlKey || e.metaKey)) return;
        e.preventDefault();
        setZoom(state.zoom + (e.deltaY < 0 ? ZOOM_STEP/2 : -ZOOM_STEP/2));
      }, { passive: false });

      // ── Page navigation ──
      function scrollToPage(n) {
        const wrap = document.getElementById(`pw-${n-1}`);
        if (wrap) $pages.scrollTo({ top: wrap.offsetTop - 16, behavior: 'smooth' });
      }
      function setCurrentPage(n) {
        state.currentPage = Math.min(state.pageCount, Math.max(1, n));
        $pageInput.value = state.currentPage;
        $btnFirst.disabled = $btnPrev.disabled = state.currentPage<=1;
        $btnLast.disabled  = $btnNext.disabled = state.currentPage>=state.pageCount;
      }
      $btnFirst.addEventListener('click', ()=>{ setCurrentPage(1); scrollToPage(1); });
      $btnPrev.addEventListener('click', ()=>{ setCurrentPage(state.currentPage-1); scrollToPage(state.currentPage); });
      $btnNext.addEventListener('click', ()=>{ setCurrentPage(state.currentPage+1); scrollToPage(state.currentPage); });
      $btnLast.addEventListener('click', ()=>{ setCurrentPage(state.pageCount); scrollToPage(state.pageCount); });
      $pageInput.addEventListener('change', ()=>{ const n=parseInt($pageInput.value,10)||1; setCurrentPage(n); scrollToPage(n); });

      // Track current page on scroll
      let _scrollT;
      $pages.addEventListener('scroll', ()=>{
        clearTimeout(_scrollT);
        _scrollT = setTimeout(()=>{
          const mid = $pages.scrollTop + $pages.clientHeight/2;
          for (let i=0;i<state.pageCount;i++){
            const w = document.getElementById(`pw-${i}`);
            if (w && mid >= w.offsetTop && mid < w.offsetTop + w.offsetHeight) { setCurrentPage(i+1); break; }
          }
        }, 60);
      });

      // ── Rotate ──
      async function rotateAll(delta) {
        state.rotations = state.rotations.map(r=>(r+delta+360)%360);
        $pages.innerHTML=''; state.textBoxes=[];
        await renderAll();
      }
      $btnRotR.addEventListener('click', ()=>rotateAll(90));
      $btnRotL.addEventListener('click', ()=>rotateAll(-90));

      // ── Save ──
      $btnSave.addEventListener('click', async ()=>{
        if ($btnSave.classList.contains('saving')) return;
        $btnSave.classList.add('saving'); $btnSave.textContent='Saving…'; showStatus('Saving…');
        const boxes = state.textBoxes.map(b=>({ pageIndex:b.pageIndex, x:b.x, y:b.y, width:b.width, height:b.height, text:b.text, fontSize:b.fontSize, scale:b.scale }));
        try {
          const res = await fetch('/save', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ filePath: state.filePath, rotations: state.rotations, textBoxes: boxes }) });
          if (!res.ok) { showStatus(await res.text(), true); return; }
          const { outputPath } = await res.json();
          showStatus(`Saved → ${outputPath.split('/').pop()}`);
          window.__savedPath = outputPath;
        } finally { $btnSave.classList.remove('saving'); $btnSave.textContent='Save'; }
      });

      // ── Load ──
      async function load() {
        state.filePath = new URLSearchParams(location.search).get('file');
        if (!state.filePath) { $pages.innerHTML='<p style="color:#f88;padding:20px">No file specified.</p>'; return; }
        const res = await fetch(`/pdf?file=${encodeURIComponent(state.filePath)}`);
        if (!res.ok) { showStatus(`Load failed: ${res.statusText}`, true); return; }
        const buf = await res.arrayBuffer();
        state.pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
        state.pageCount = state.pdfDoc.numPages;
        state.rotations = Array(state.pageCount).fill(0);
        state.zoom = 1.0;
        updateZoomUI();
        await renderAll();
        setCurrentPage(1);

        // The Claude preview panel animates its width open; re-fit once it settles
        // so the initial render isn't stuck at the mid-animation width.
        setTimeout(() => {
          state.zoom = 1.0; updateZoomUI();
          for (let i=0;i<state.pageCount;i++) renderPage(i);
          state.ready = true;
        }, 400);
      }

      // ── Resize: re-fit width (zoom multiplier preserved) ──
      let _resizeT, _lastW = 0;
      new ResizeObserver(()=>{
        const w = $pages.clientWidth;
        if (!state.pdfDoc || Math.abs(w-_lastW)<2) return;
        _lastW = w;
        clearTimeout(_resizeT);
        _resizeT = setTimeout(()=>{ for (let i=0;i<state.pageCount;i++) renderPage(i); }, 100);
      }).observe($pages);

      updateZoomUI();
      await load();
    </script>
  </body>
</html>
