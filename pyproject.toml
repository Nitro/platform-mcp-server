[project]
name = "platform-mcp-server"
dynamic = ["version"]
description = "MCP server for Nitro Document Intelligence Platform"
authors = [{name = "rpalekar", email = "rajvardhan.palekar@gonitro.com"}]
readme = "README.md"
keywords = ["mcp", "pdf", "document-intelligence"]
requires-python = ">=3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=1.21.2",
    "httpx>=0.28.1",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pre-commit>=2.20.0",
    "pyright>=1.1.390",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.5",
    "pylint>=3.3.8",
    "pylint-pydantic>=0.3.2",
    "pytest-asyncio>=1.1.0",
    "pytest-socket>=0.7.0",
    "pytest-mock>=3.15.0",
    "pytest-httpx>=0.36.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
nitro-mcp = "app.server:main"

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportUnusedExpression = "error"
reportImplicitStringConcatenation = "error"
reportMissingTypeStubs = "warning"

[[tool.pyright.executionEnvironments]]
reportUnusedFunction = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ANN",   # type annotations
    "ARG",   # unused arguments
    "B",     # bugbear (common bugs & bad patterns)
    "BLE",   # blind excepts
    "C4",    # comprehensions
    "COM",   # commas
    "DTZ",   # datetime timezone
    "E",     # pycodestyle errors
    "ERA",   # eradicate commented-out code
    "FA",    # future annotations
    "FBT",   # boolean trap
    "F",     # pyflakes
    "I",     # import sorting
    "ICN",   # import conventions
    "ISC",   # implicit str concat
    "N",     # naming conventions
    "NPY",   # numpy rules
    "PGH",   # pygrep-hooks
    "PTH",   # pathlib
    "PT",    # pytest style
    "RET",   # return statements
    "RUF",   # Ruff extra rules
    "TRY",   # tryceratops
    "S",     # security
    "SIM",   # simplifications
    "C90",   # mccabe complexity
    "TID",   # tidy imports
    "TC",    # typing under TYPE_CHECKING
    "TD",    # TODOs must be annotated
    "UP",    # pyupgrade / newer syntax
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
    "T10",   # debugger statements
]
ignore = [
    "D211",  # no-blank-line-before-class
    "D213",  # multi-line-summary-second-line
    "S101",  # use of assert detected
    "COM812" # missing trailing comma in a list or tuple
]

[tool.ruff.lint.per-file-ignores]
"tests/**/test*.py" = [
    "ANN201",  # Missing return type annotation in tests
    "ARG001",  # Unused function argument
    "E501",    # Allow long lines in test docstrings / mock data
    "S105",    # Hardcoded passwords/tokens in tests
    "S106",    # Hardcoded secrets/tokens in tests
]
"app/**/*.py" = [
    "TC002",   # MCP Context/Session types must be available at runtime for FastMCP introspection
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
preview = true
docstring-code-format = true
quote-style = "double"

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.pylint]
known-third-party = ["mcp"]

[tool.pylint.main]
load-plugins = ["pylint_pydantic"]
